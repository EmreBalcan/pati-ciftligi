<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#173b2b"><meta name="description" content="Hayvanları sapanla fırlat, eşleştir ve büyüt."><title>Merge Meadow</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}html{background:#07150f}body{margin:0;min-height:100vh;color:#fff;font:600 16px/1.35 ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:#07150f;overscroll-behavior:none}.app{width:min(100%,560px);margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}.top,.brand,.hud,.maps,.queue{display:flex;align-items:center}.top{justify-content:space-between;margin-bottom:8px}.brand{gap:9px}.logo{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:#ffe58a;color:#483314;font-size:21px;box-shadow:0 7px 22px #0005}.brand b{display:block;font-size:18px}.sub,.label{font-size:11px;color:#d7e4da}.icon{width:39px;height:39px;border:1px solid #ffffff42;border-radius:13px;background:#102b20cc;color:white;font-size:20px}.maps{gap:6px;margin-bottom:8px}.map{flex:1;border:1px solid #ffffff3a;background:#102b20b8;color:#dceae0;padding:8px 4px;border-radius:12px;font:700 13px inherit}.map.active{background:#fff0b0;color:#493815;border-color:#fff0b0}.hud{gap:8px;margin-bottom:8px}.card{background:#0c241dcc;border:1px solid #ffffff2e;border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 10px 30px #0004}.score{padding:8px 12px;min-width:100px}.score strong{display:block;font-size:23px}.next{display:flex;align-items:center;justify-content:space-between;flex:1;padding:7px 11px}.queue{gap:4px}.q{width:38px;height:38px;background-repeat:no-repeat;background-size:contain;background-position:center;filter:drop-shadow(0 4px 5px #0005)}.q:nth-child(2){transform:scale(.82);opacity:.75}.q:nth-child(3){transform:scale(.68);opacity:.55}.game{position:relative;height:min(69vh,610px);min-height:470px;border-radius:24px;overflow:hidden;background-position:center;background-size:360px;box-shadow:0 20px 60px #0009;border:1px solid #ffffff55}.game:after{content:"";position:absolute;z-index:2;inset:0;background:radial-gradient(circle at 72% 24%,#fff4ad4f 0 8%,transparent 28%),linear-gradient(128deg,transparent 0 22%,#fff5ba24 31%,transparent 42%),radial-gradient(ellipse at center,#0000 48%,#0a17113d 100%);pointer-events:none}.decor{position:absolute;z-index:1;pointer-events:none;object-fit:contain;filter:drop-shadow(9px 12px 8px #16300f80)}.decor.d0{width:145px;left:-52px;top:-25px}.decor.d1{width:120px;right:-38px;top:70px}.decor.d2{width:92px;left:-18px;bottom:74px}.decor.d3{width:72px;right:7px;bottom:36px}.decor.d4{width:82px;right:-14px;top:-18px}.decor.d5{width:68px;left:12px;top:205px}.game:not(.forest) .decor{display:none}.limit{position:absolute;z-index:2;left:60px;right:60px;bottom:112px;border-top:2px dashed #fff;filter:drop-shadow(0 1px 2px #0008)}.limit span{display:none}.fence{position:absolute;z-index:4;pointer-events:none;background-repeat:no-repeat;background-position:center;background-size:100% 100%;filter:drop-shadow(3px 5px 4px #0008)}.fence.left,.fence.right{top:55px;bottom:105px;width:30px;background-image:url('/assets/fence/piece-2.png')}.fence.left{left:48px}.fence.right{right:48px}.fence.top{left:49px;right:49px;top:46px;height:38px;background-image:url('/assets/fence/piece-0.png')}canvas{position:absolute;z-index:3;inset:0;width:100%;height:100%;touch-action:none}.tip{text-align:center;color:#d9e9df;font-size:12px;margin:8px 0 0}.toast{position:fixed;z-index:9;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;transition:.25s;background:white;color:#183326;border-radius:99px;padding:10px 16px;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:720px){.game{height:60vh;min-height:390px}.tip{display:none}}
</style><link rel="stylesheet" href="/scene.css"></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">🐾</div><div><b>Merge Meadow</b><span class="sub">Çek, nişan al, fırlat!</span></div></div><button class="icon" id="reset" aria-label="Oyunu yeniden başlat">↻</button></header><nav class="maps" aria-label="Harita seçimi"><button class="map active" data-map="forest">🌲 Orman</button><button class="map" data-map="desert">🌵 Çöl</button><button class="map" data-map="polar">❄️ Kutup</button></nav><section class="hud"><div class="card score"><span class="label">SKOR</span><strong id="score">0</strong></div><div class="card next"><span class="label">SIRADAKİ</span><div class="queue" id="queue"></div></div></section><section class="game forest" id="game"><img class="decor d0" src="/assets/decor/forest-0.png"><img class="decor d1" src="/assets/decor/forest-1.png"><img class="decor d2" src="/assets/decor/forest-2.png"><img class="decor d3" src="/assets/decor/forest-3.png"><img class="decor d4" src="/assets/decor/forest-4.png"><img class="decor d5" src="/assets/decor/forest-5.png"><div class="limit"><span>DOLULUK SINIRI</span></div><div class="fence left"></div><div class="fence top"></div><div class="fence right"></div><canvas id="canvas" aria-label="Sapanla hayvan birleştirme oyun alanı"></canvas></section><p class="tip">Hayvanı aşağı doğru çek, açı ver ve bırak. Çitlerden sektirebilirsin.</p></main><div class="toast" id="toast"></div><script>
const C=document.querySelector('#canvas'),X=C.getContext('2d'),game=document.querySelector('#game'),scoreEl=document.querySelector('#score'),queueEl=document.querySelector('#queue'),toast=document.querySelector('#toast');
const maps={forest:{bg:'/assets/forest-ground-v2.png',names:['Fare','Sincap','Tavşan','Kirpi','Rakun','Tilki','Geyik','Ayı','Geyik Kral']},desert:{bg:'/assets/desert-ground.png',names:['Çöl Faresi','Fenek','Mirket','Kaplumbağa','Armadillo','Deve','Antilop','Aslan','Fil']},polar:{bg:'/assets/polar-ground.png',names:['Lemming','Pufla','Kutup Tavşanı','Fok','Kutup Tilkisi','Penguen','Mors','Kutup Ayısı','Narval']}};
const scenery=[
  ['tree','/assets/forest-tree-v2.png',2,2,1.10],['tree','/assets/forest-tree-v2.png',17,0,.82],['tree','/assets/forest-tree-v2.png',48,-2,.75],['tree','/assets/forest-tree-v2.png',82,0,.9],['tree','/assets/forest-tree-v2.png',101,3,1.08],
  ['tree','/assets/forest-tree-v2.png',-5,28,.86],['tree','/assets/forest-tree-v2.png',105,26,.88],['tree','/assets/forest-tree-v2.png',-8,77,.9],['tree','/assets/forest-tree-v2.png',105,77,.94],
  ['pine','/assets/decor/forest-1.png',9,47,.88],['pine','/assets/decor/forest-1.png',92,51,.9],['rock','/assets/decor/forest-2.png',18,73,.78],['rock','/assets/decor/forest-2.png',87,29,.65],
  ['bush','/assets/decor/forest-4.png',14,17,.72],['bush','/assets/decor/forest-4.png',85,83,.85],['grass','/assets/decor/forest-3.png',32,82,.7],['grass','/assets/decor/forest-3.png',68,85,.75],['log','/assets/decor/forest-5.png',12,84,.7]
];
const limitEl=game.querySelector('.limit');for(const [kind,src,x,y,s] of scenery){const o=document.createElement('div');o.className='scenery '+kind;o.style.cssText=`left:${x}%;top:${y}%;scale:${s}`;const im=document.createElement('img');im.src=src;im.alt='';o.append(im);game.insertBefore(o,limitEl)}
const animalSrc=(biome,l)=>`/assets/animals/${biome}-${l}.png`,imgs={};let map='forest',W,H,dpr,bodies=[],queue=[],tracks=[],score=0,drag=null,over=false,flash=0,last=performance.now();const anchor=()=>({x:W/2,y:H*.86}),bounds=()=>({l:W*.245,r:W*.755,t:H*.19,line:H*.72});
for(const k of Object.keys(maps)){imgs[k]=[];for(let i=0;i<9;i++){let im=new Image;im.src=animalSrc(k,i);imgs[k].push(im)}}function fit(){const oldW=W,oldH=H;dpr=Math.min(devicePixelRatio||1,2);W=C.clientWidth;H=C.clientHeight;if(oldW&&oldH){for(const b of bodies){b.x*=W/oldW;b.y*=H/oldH}for(const t of tracks){t.x*=W/oldW;t.y*=H/oldH}if(drag){drag.x*=W/oldW;drag.y*=H/oldH}}C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',fit);fit();
function rnd(){let n=Math.random();return n<.62?0:n<.88?1:2}function refill(){while(queue.length<3)queue.push(rnd());queueEl.innerHTML=queue.map((n,i)=>`<span class="q" style="background-image:url(${animalSrc(map,n)})" title="${maps[map].names[n]}"></span>`).join('')}
function radius(l){return Math.max(.72,Math.min(1.15,H/500))*(17+l*4.1)}function spawn(x,y,l,vx,vy){bodies.push({x,y,l,r:radius(l),vx,vy,age:0,dead:false,hit:0,entered:false,trailTick:0})}function fire(vx,vy){let a=anchor(),l=queue.shift();spawn(a.x,a.y-radius(l),l,vx,vy);refill()}
function pos(e){let r=C.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}C.addEventListener('pointerdown',e=>{e.preventDefault();if(over)return reset();let p=pos(e),a=anchor();if(Math.hypot(p.x-a.x,p.y-a.y)<105||p.y>H-145){drag={x:p.x,y:Math.max(a.y,p.y)};C.setPointerCapture(e.pointerId)}});C.addEventListener('pointermove',e=>{if(drag){e.preventDefault();let p=pos(e),a=anchor();drag={x:p.x,y:Math.max(a.y,p.y)}}});C.addEventListener('pointerup',e=>{if(!drag)return;e.preventDefault();let a=anchor(),dx=a.x-drag.x,dy=a.y-drag.y,dist=Math.hypot(dx,dy);if(dist>10){let power=1.2+Math.min(135,dist)*.06,ang=Math.atan2(dy,dx);fire(Math.cos(ang)*power,Math.sin(ang)*power)}drag=null});C.addEventListener('pointercancel',()=>drag=null);
function step(dt){if(over)return;let box=bounds();for(const b of bodies){b.age++;let speed=Math.hypot(b.vx,b.vy);b.x+=b.vx*dt;b.y+=b.vy*dt;b.hit*=Math.pow(.84,dt);b.vx*=Math.pow(.976,dt);b.vy*=Math.pow(.976,dt);if(speed>.7&&++b.trailTick%5===0)tracks.push({x:b.x,y:b.y,r:b.r*.52,a:.42});if(Math.hypot(b.vx,b.vy)<.035)b.vx=b.vy=0;const L=box.l+b.r,R=box.r-b.r,T=box.t+b.r;if(b.x<L){b.x=L;b.hit=Math.min(1,Math.abs(b.vx)/12);b.vx=Math.abs(b.vx)*.42}if(b.x>R){b.x=R;b.hit=Math.min(1,Math.abs(b.vx)/12);b.vx=-Math.abs(b.vx)*.42}if(b.y<T){b.y=T;b.hit=Math.min(1,Math.abs(b.vy)/12);b.vy=Math.abs(b.vy)*.42}if(b.y+b.r<box.line)b.entered=true;if((b.entered&&b.y-b.r>box.line)||(!b.entered&&b.age>70&&speed<.15)){over=true;pop('Çizgi geçildi — oyun bitti')}}tracks.forEach(t=>t.a*=Math.pow(.997,dt));tracks=tracks.filter(t=>t.a>.035);
for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){let a=bodies[i],b=bodies[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,m=a.r+b.r;if(d<m){if(a.l===b.l&&!a.dead&&!b.dead&&a.age>12&&b.age>12){a.dead=b.dead=true;let nl=Math.min(8,a.l+1);spawn((a.x+b.x)/2,(a.y+b.y)/2,nl,(a.vx+b.vx)*.22,(a.vy+b.vy)*.22);score+=20*Math.pow(2,nl);scoreEl.textContent=score;flash=12;pop(`${maps[map].names[nl]}! +${20*Math.pow(2,nl)}`)}else{let nx=dx/d,ny=dy/d,p=(m-d)*.52;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;let rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){let q=-rv*.42;a.vx-=q*nx;a.vy-=q*ny;b.vx+=q*nx;b.vy+=q*ny;let impact=Math.min(1,Math.abs(rv)/11);a.hit=Math.max(a.hit,impact);b.hit=Math.max(b.hit,impact)}}}}bodies=bodies.filter(b=>!b.dead)}
function animal(b,alpha=1){let im=imgs[map][b.l];X.save();X.globalAlpha=alpha;X.translate(b.x,b.y);let s=b.r*2.55,h=b.hit||0;X.scale(1+h*.08,1-h*.06);X.shadowColor='#0008';X.shadowBlur=8;if(im&&im.complete&&im.naturalWidth){let ratio=im.naturalWidth/im.naturalHeight,w=ratio>=1?s:s*ratio,hg=ratio>=1?s/ratio:s;X.drawImage(im,-w/2,-hg/2,w,hg)}else{X.fillStyle='#f5c56f';X.beginPath();X.arc(0,0,b.r,0,7);X.fill()}X.restore()}
function drawTracks(){for(const t of tracks){X.save();X.globalAlpha=t.a;X.fillStyle=map==='forest'?'#563a20':map==='desert'?'#9b6235':'#86a6c9';X.beginPath();X.ellipse(t.x,t.y,t.r*1.15,t.r*.52,0,0,7);X.fill();X.strokeStyle=map==='polar'?'#d8efff':'#ffffff35';X.lineWidth=2;X.stroke();X.restore()}}
function sling(){let a=anchor(),p=drag||{x:a.x,y:a.y};if(drag){let dx=a.x-p.x,dy=a.y-p.y,dist=Math.hypot(dx,dy),mag=1.2+Math.min(135,dist)*.06,ang=Math.atan2(dy,dx);X.fillStyle='#fff9';for(let t=1;t<11;t++){let tt=t*3.4,x=a.x+Math.cos(ang)*mag*tt,y=a.y+Math.sin(ang)*mag*tt;X.beginPath();X.arc(x,y,Math.max(1,4-t*.25),0,7);X.fill()}}X.strokeStyle='#563316';X.lineWidth=8;X.lineCap='round';X.beginPath();X.moveTo(a.x-28,a.y+25);X.lineTo(a.x-18,a.y-10);X.moveTo(a.x+28,a.y+25);X.lineTo(a.x+18,a.y-10);X.stroke();X.strokeStyle='#bd6938';X.lineWidth=5;X.beginPath();X.moveTo(a.x-18,a.y-10);X.lineTo(p.x,p.y);X.lineTo(a.x+18,a.y-10);X.stroke();animal({x:p.x,y:p.y-5,l:queue[0],r:22,hit:0},.96)}
function draw(now){let dt=Math.min(2,(now-last)/16.67);last=now;X.clearRect(0,0,W,H);step(dt);drawTracks();bodies.forEach(b=>animal(b));sling();if(flash>0){X.fillStyle=`rgba(255,255,210,${flash/45})`;X.fillRect(0,0,W,H);flash--}requestAnimationFrame(draw)}function pop(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1200)}function reset(){bodies=[];queue=[];tracks=[];score=0;over=false;drag=null;scoreEl.textContent=0;refill();pop('Yeni oyun')}
document.querySelector('#reset').onclick=reset;document.querySelectorAll('.map').forEach(b=>b.onclick=()=>{document.querySelector('.map.active').classList.remove('active');b.classList.add('active');map=b.dataset.map;game.className='game '+map;game.style.backgroundImage=`url(${maps[map].bg})`;reset()});game.style.backgroundImage=`url(${maps[map].bg})`;refill();Promise.all(Object.values(imgs).flat().map(im=>im.decode().catch(()=>{}))).then(()=>pop('Hayvanlar hazır'));requestAnimationFrame(draw);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
