<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071a17"><meta name="description" content="Şekilleri birleştir, zinciri büyüt ve rekorunu kır.">
  <title>Merge Meadow</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root{--ink:#f6fff8;--muted:#9bb9ae;--line:#22423a;--panel:#0d2822;--lime:#b8f34a;--yellow:#ffcf5c;--coral:#ff7a66}*{box-sizing:border-box}html{background:#051410}body{margin:0;color:var(--ink);font:500 16px/1.45 ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#194f40 0,#071a17 44%,#051410 100%);min-height:100vh;overscroll-behavior:none}.shell{width:min(100%,560px);margin:auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border-radius:14px;background:var(--lime);display:grid;place-items:center;color:#102016;font-size:23px;box-shadow:0 8px 28px #b8f34a33}.brand b{display:block;font-size:19px}.brand span,.micro{font-size:12px;color:var(--muted)}button{font:inherit}.icon-btn{border:1px solid var(--line);background:#0d2822cc;color:white;width:42px;height:42px;border-radius:14px;font-size:19px}.hud{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-bottom:10px}.card{background:linear-gradient(145deg,#11342cdd,#0a211cdd);border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 14px 40px #0004}.score strong{font-size:28px;line-height:1.1}.next{display:flex;align-items:center;justify-content:space-between}.queue{display:flex;gap:9px;align-items:center}.preview{display:grid;place-items:center;width:34px;height:34px;filter:drop-shadow(0 6px 7px #0005)}.preview:nth-child(2){opacity:.72;transform:scale(.83)}.preview:nth-child(3){opacity:.48;transform:scale(.68)}.game-wrap{position:relative;border-radius:30px;overflow:hidden;border:1px solid #2d5e50;background:linear-gradient(#0d332a,#071e19);box-shadow:0 24px 70px #0008,inset 0 0 70px #0b533a22}.game-wrap:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#72e5b01e 1px,transparent 1px);background-size:20px 20px;pointer-events:none}.danger{position:absolute;left:0;right:0;top:18%;border-top:1px dashed #ff7a6699;z-index:2}.danger span{position:absolute;right:9px;top:-19px;color:#ff9c8d;font-size:11px}canvas{display:block;width:100%;height:min(66vh,590px);touch-action:none;position:relative;z-index:1}.hint{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 18px}.download{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.download h2{font-size:18px;margin:0 0 4px}.download p{font-size:13px;color:var(--muted);margin:0 0 12px}.install{border:0;background:var(--lime);color:#102016;border-radius:14px;padding:11px 16px;font-weight:800}.qr{width:88px;height:88px;background:white;border-radius:12px;padding:6px;object-fit:contain}.note{margin-top:10px;font-size:11px;color:#78978d}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#f6fff8;color:#102016;border-radius:99px;padding:10px 16px;font-weight:800;opacity:0;transition:.25s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:720px){canvas{height:52vh}.hint{margin:7px 0 10px}.download{padding:10px 14px}.qr{width:68px;height:68px}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div class="brand"><div class="logo">◆</div><div><b>Merge Meadow</b><span>Şekilleri büyüt</span></div></div><button class="icon-btn" id="reset" aria-label="Oyunu yeniden başlat">↻</button></header>
  <section class="hud"><div class="card score"><div class="micro">SKOR</div><strong id="score">0</strong><div class="micro">EN İYİ <span id="best">0</span></div></div><div class="card next"><div><div class="micro">SIRADAKİ</div><div class="queue" id="queue"></div></div><span style="font-size:22px;color:var(--lime)">•••</span></div></section>
  <section class="game-wrap"><div class="danger"><span>Sınır</span></div><canvas id="game" aria-label="Birleştirme oyun alanı"></canvas></section>
  <p class="hint">Dokun, konumu seç ve şekli bırak. Aynı şekiller birleşir.</p>
  <section class="card download"><div><h2>Telefonuna ekle</h2><p>QR kodu tara veya uygulamayı ana ekranına kur.</p><button class="install" id="install">Uygulamayı Kur</button><div class="note">Android APK paketi bir sonraki dağıtım adımında burada yer alacak.</div></div><img class="qr" alt="Oyunu telefonda açmak için QR kod" src="https://quickchart.io/qr?size=180&text=https%3A%2F%2Fmerge-meadow-mobile.emrebalcan494.chatgpt.site"></section>
</main><div class="toast" id="toast"></div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),queueEl=document.querySelector('#queue'),toast=document.querySelector('#toast');
const colors=['#ffcf5c','#72e5b0','#ff7a66','#8e9cff','#f39de2','#7bd8f6','#f8eee0'];
const labels=['●','■','▬','▲','⬟','◆','✦']; let W,H,dpr,bodies=[],score=0,queue=[],aimX=0,over=false,deferred;
bestEl.textContent=localStorage.mergeBest||0;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);aimX=W/2} addEventListener('resize',size);size();
function rand(){return Math.random()<.72?0:Math.random()<.85?1:2} function refill(){while(queue.length<3)queue.push(rand());queueEl.innerHTML=queue.map((n,i)=>`<span class="preview" style="color:${colors[n]};font-size:${28-i*3}px">${labels[n]}</span>`).join('')}
function radius(l){return 19+l*5.2} function add(x,l){let r=radius(l);bodies.push({x:Math.max(r,Math.min(W-r,x)),y:26,r,l,vx:0,vy:0,dead:false,age:0});}
function drop(x){if(over)return;add(x,queue.shift());refill()}
canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();aimX=e.clientX-r.left});canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect();drop(e.clientX-r.left)});
function physics(){if(over)return;const g=.22;for(const b of bodies){b.age++;b.vy+=g;b.x+=b.vx;b.y+=b.vy;b.vx*=.994;b.vy*=.994;if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*.45}if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.45}if(b.y+b.r>H){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.35}}
 for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){let a=bodies[i],b=bodies[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.1,min=a.r+b.r;if(dist<min){if(a.l===b.l&&!a.dead&&!b.dead&&a.age>8&&b.age>8){a.dead=b.dead=true;let nl=Math.min(a.l+1,colors.length-1);add((a.x+b.x)/2,nl);bodies.at(-1).y=(a.y+b.y)/2;bodies.at(-1).vy=-3.2;score+=Math.pow(2,nl+1)*10;scoreEl.textContent=score;if(score>(localStorage.mergeBest||0)){localStorage.mergeBest=score;bestEl.textContent=score}pulse(`${labels[nl]} +${Math.pow(2,nl+1)*10}`)}else{let nx=dx/dist,ny=dy/dist,p=(min-dist)*.52;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;let rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){let imp=-rv*.62;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}}}}
 bodies=bodies.filter(b=>!b.dead);if(bodies.some(b=>b.y-b.r<H*.18&&b.age>260&&Math.abs(b.vy)<.4)){over=true;pulse('Oyun bitti — yeniden dene!')}}
function shape(b){ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle=colors[b.l];ctx.shadowColor=colors[b.l]+'66';ctx.shadowBlur=16;ctx.beginPath();if(b.l===0)ctx.arc(0,0,b.r,0,Math.PI*2);else if(b.l===1)ctx.roundRect(-b.r*.85,-b.r*.85,b.r*1.7,b.r*1.7,7);else if(b.l===2)ctx.roundRect(-b.r,-b.r*.66,b.r*2,b.r*1.32,9);else{let sides=Math.min(3+b.l,8);for(let i=0;i<sides;i++){let a=-Math.PI/2+i*Math.PI*2/sides,x=Math.cos(a)*b.r,y=Math.sin(a)*b.r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#082019';ctx.font=`800 ${Math.max(12,b.r*.55)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.l+1,0,1);ctx.restore()}
function loop(){ctx.clearRect(0,0,W,H);ctx.strokeStyle='#b8f34a55';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(aimX,0);ctx.lineTo(aimX,62);ctx.stroke();ctx.setLineDash([]);physics();bodies.forEach(shape);requestAnimationFrame(loop)}
function pulse(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1100)}function reset(){bodies=[];score=0;over=false;scoreEl.textContent=0;queue=[];refill();pulse('Yeni oyun')}
document.querySelector('#reset').onclick=reset;document.querySelector('#install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else pulse('Tarayıcı menüsünden “Ana ekrana ekle”yi seç')};addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');refill();loop();
</script></body></html>
