<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#173b2b"><meta name="description" content="Hayvanları sapanla fırlat, eşleştir ve büyüt."><title>Merge Meadow</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}html{background:#07150f}body{margin:0;min-height:100vh;color:#fff;font:600 16px/1.35 ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;background:#07150f;overscroll-behavior:none}.app{width:min(100%,560px);margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}.top,.brand,.hud,.maps,.queue{display:flex;align-items:center}.top{justify-content:space-between;margin-bottom:8px}.brand{gap:9px}.logo{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:#ffe58a;color:#483314;font-size:21px;box-shadow:0 7px 22px #0005}.brand b{display:block;font-size:18px}.sub,.label{font-size:11px;color:#d7e4da}.icon{width:39px;height:39px;border:1px solid #ffffff42;border-radius:13px;background:#102b20cc;color:white;font-size:20px}.maps{gap:6px;margin-bottom:8px}.map{flex:1;border:1px solid #ffffff3a;background:#102b20b8;color:#dceae0;padding:8px 4px;border-radius:12px;font:700 13px inherit}.map.active{background:#fff0b0;color:#493815;border-color:#fff0b0}.hud{gap:8px;margin-bottom:8px}.card{background:#0c241dcc;border:1px solid #ffffff2e;border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 10px 30px #0004}.score{padding:8px 12px;min-width:100px}.score strong{display:block;font-size:23px}.next{display:flex;align-items:center;justify-content:space-between;flex:1;padding:7px 11px}.queue{gap:4px}.q{width:38px;height:38px;background-repeat:no-repeat;background-size:300% 300%;filter:drop-shadow(0 4px 5px #0005)}.q:nth-child(2){transform:scale(.82);opacity:.75}.q:nth-child(3){transform:scale(.68);opacity:.55}.game{position:relative;height:min(69vh,610px);min-height:470px;border-radius:24px;overflow:hidden;background-position:center;background-size:cover;box-shadow:0 20px 60px #0009;border:1px solid #ffffff55}.game:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#0000 45%,#14211233 100%);pointer-events:none}.limit{position:absolute;z-index:2;left:60px;right:60px;bottom:112px;border-top:2px dashed #fff8;filter:drop-shadow(0 1px 2px #0008)}.limit span{display:none}.fence{position:absolute;z-index:2;top:58px;bottom:100px;width:14px;border-radius:7px;background:linear-gradient(90deg,#4f2d15 0 2px,#a96d32 2px 6px,#d39851 6px 9px,#75451f 9px 12px,#43250f 12px);box-shadow:1px 3px 5px #0006;pointer-events:none}.fence:after{content:"";position:absolute;inset:-3px;background:repeating-linear-gradient(0deg,#3f240f 0 5px,transparent 5px 45px,#d39851 45px 51px,transparent 51px 88px);border-radius:6px}.fence.left{left:50px}.fence.right{right:50px;transform:scaleX(-1)}.fence.top{left:50px;right:50px;top:51px;bottom:auto;width:auto;height:14px;background:linear-gradient(0deg,#4f2d15 0 2px,#a96d32 2px 6px,#d39851 6px 9px,#75451f 9px 12px,#43250f 12px);box-shadow:2px 3px 5px #0006}.fence.top:after{inset:-3px;background:repeating-linear-gradient(90deg,#3f240f 0 5px,transparent 5px 45px,#d39851 45px 51px,transparent 51px 88px)}canvas{position:absolute;z-index:3;inset:0;width:100%;height:100%;touch-action:none}.tip{text-align:center;color:#d9e9df;font-size:12px;margin:8px 0 0}.toast{position:fixed;z-index:9;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;transition:.25s;background:white;color:#183326;border-radius:99px;padding:10px 16px;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:720px){.game{height:60vh;min-height:390px}.tip{display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">🐾</div><div><b>Merge Meadow</b><span class="sub">Çek, nişan al, fırlat!</span></div></div><button class="icon" id="reset" aria-label="Oyunu yeniden başlat">↻</button></header><nav class="maps" aria-label="Harita seçimi"><button class="map active" data-map="forest">🌲 Orman</button><button class="map" data-map="desert">🌵 Çöl</button><button class="map" data-map="polar">❄️ Kutup</button></nav><section class="hud"><div class="card score"><span class="label">SKOR</span><strong id="score">0</strong></div><div class="card next"><span class="label">SIRADAKİ</span><div class="queue" id="queue"></div></div></section><section class="game" id="game"><div class="limit"><span>DOLULUK SINIRI</span></div><div class="fence left"></div><div class="fence top"></div><div class="fence right"></div><canvas id="canvas" aria-label="Sapanla hayvan birleştirme oyun alanı"></canvas></section><p class="tip">Hayvanı aşağı doğru çek, açı ver ve bırak. Çitlerden sektirebilirsin.</p></main><div class="toast" id="toast"></div><script>
const C=document.querySelector('#canvas'),X=C.getContext('2d'),game=document.querySelector('#game'),scoreEl=document.querySelector('#score'),queueEl=document.querySelector('#queue'),toast=document.querySelector('#toast');
const maps={forest:{bg:'/assets/forest-bg.png',sheet:'/assets/forest-animals.png',names:['Fare','Sincap','Tavşan','Kirpi','Rakun','Tilki','Geyik','Ayı','Geyik Kral']},desert:{bg:'/assets/desert-bg.png',sheet:'/assets/desert-animals.png',names:['Çöl Faresi','Fenek','Mirket','Kaplumbağa','Armadillo','Deve','Antilop','Aslan','Fil']},polar:{bg:'/assets/polar-bg.png',sheet:'/assets/polar-animals.png',names:['Lemming','Pufla','Kutup Tavşanı','Fok','Kutup Tilkisi','Penguen','Mors','Kutup Ayısı','Narval']}};
const imgs={};let map='forest',W,H,dpr,bodies=[],queue=[],score=0,drag=null,over=false,flash=0,last=performance.now();const anchor=()=>({x:W/2,y:H-50}),bounds=()=>({l:64,r:W-64,t:65,b:H-112});
for(const [k,v] of Object.entries(maps)){imgs[k]=new Image;imgs[k].src=v.sheet}function fit(){dpr=Math.min(devicePixelRatio||1,2);W=C.clientWidth;H=C.clientHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',fit);fit();
function rnd(){let n=Math.random();return n<.62?0:n<.88?1:2}function refill(){while(queue.length<3)queue.push(rnd());queueEl.innerHTML=queue.map((n,i)=>`<span class="q" style="background-image:url(${maps[map].sheet});background-position:${-(n%3)*100}% ${-Math.floor(n/3)*100}%" title="${maps[map].names[n]}"></span>`).join('')}
function radius(l){return 17+l*4.1}function spawn(x,y,l,vx,vy){bodies.push({x,y,l,r:radius(l),vx,vy,age:0,dead:false,hit:0})}function fire(vx,vy){let a=anchor(),l=queue.shift();spawn(a.x,a.y-18,l,vx,vy);refill()}
function pos(e){let r=C.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}C.addEventListener('pointerdown',e=>{if(over)return reset();let p=pos(e),a=anchor();if(Math.hypot(p.x-a.x,p.y-a.y)<95){drag={x:p.x,y:Math.max(a.y,p.y)};C.setPointerCapture(e.pointerId)}});C.addEventListener('pointermove',e=>{if(drag){let p=pos(e),a=anchor();drag={x:p.x,y:Math.max(a.y,p.y)}}});C.addEventListener('pointerup',e=>{if(!drag)return;let a=anchor(),dx=a.x-drag.x,dy=a.y-drag.y,dist=Math.hypot(dx,dy);if(dist>10){let power=2.2+Math.min(135,dist)*.12,ang=Math.atan2(dy,dx);fire(Math.cos(ang)*power,Math.sin(ang)*power)}drag=null});C.addEventListener('pointercancel',()=>drag=null);
function step(dt){if(over)return;let box=bounds();for(const b of bodies){b.age++;b.x+=b.vx*dt;b.y+=b.vy*dt;b.hit*=Math.pow(.84,dt);b.vx*=Math.pow(.989,dt);b.vy*=Math.pow(.989,dt);if(Math.hypot(b.vx,b.vy)<.035)b.vx=b.vy=0;const L=box.l+b.r,R=box.r-b.r,T=box.t+b.r,F=box.b-b.r;if(b.x<L){b.x=L;b.hit=Math.min(1,Math.abs(b.vx)/12);b.vx=Math.abs(b.vx)*.8}if(b.x>R){b.x=R;b.hit=Math.min(1,Math.abs(b.vx)/12);b.vx=-Math.abs(b.vx)*.8}if(b.y<T){b.y=T;b.hit=Math.min(1,Math.abs(b.vy)/12);b.vy=Math.abs(b.vy)*.8}if(b.y>F){b.y=F;b.hit=Math.min(1,Math.abs(b.vy)/12);b.vy=-Math.abs(b.vy)*.8}}
for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){let a=bodies[i],b=bodies[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,m=a.r+b.r;if(d<m){if(a.l===b.l&&!a.dead&&!b.dead&&a.age>12&&b.age>12){a.dead=b.dead=true;let nl=Math.min(8,a.l+1);spawn((a.x+b.x)/2,(a.y+b.y)/2,nl,(a.vx+b.vx)*.38,(a.vy+b.vy)*.38);score+=20*Math.pow(2,nl);scoreEl.textContent=score;flash=12;pop(`${maps[map].names[nl]}! +${20*Math.pow(2,nl)}`)}else{let nx=dx/d,ny=dy/d,p=(m-d)*.52;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;let rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){let q=-rv*.76;a.vx-=q*nx;a.vy-=q*ny;b.vx+=q*nx;b.vy+=q*ny;let impact=Math.min(1,Math.abs(rv)/11);a.hit=Math.max(a.hit,impact);b.hit=Math.max(b.hit,impact)}}}}bodies=bodies.filter(b=>!b.dead);if(bodies.some(b=>b.y+b.r>H-112&&b.age>260&&Math.hypot(b.vx,b.vy)<.3)){over=true;pop('Alan doldu — dokunup yeniden başla')}}
function animal(b,alpha=1){let im=imgs[map];if(!im.complete)return;let sw=im.naturalWidth/3,sh=im.naturalHeight/3,sx=(b.l%3)*sw,sy=Math.floor(b.l/3)*sh;X.save();X.globalAlpha=alpha;X.translate(b.x,b.y);let s=b.r*2.5,h=b.hit||0;X.scale(1+h*.08,1-h*.06);X.shadowColor='#0008';X.shadowBlur=8;X.drawImage(im,sx,sy,sw,sh,-s/2,-s/2,s,s);X.restore()}
function sling(){let a=anchor(),p=drag||{x:a.x,y:a.y};if(drag){let dx=a.x-p.x,dy=a.y-p.y,dist=Math.hypot(dx,dy),mag=2.2+Math.min(135,dist)*.12,ang=Math.atan2(dy,dx);X.fillStyle='#fff9';for(let t=1;t<11;t++){let tt=t*3.4,x=a.x+Math.cos(ang)*mag*tt,y=a.y+Math.sin(ang)*mag*tt;X.beginPath();X.arc(x,y,Math.max(1,4-t*.25),0,7);X.fill()}}X.strokeStyle='#563316';X.lineWidth=8;X.lineCap='round';X.beginPath();X.moveTo(a.x-28,a.y+25);X.lineTo(a.x-18,a.y-10);X.moveTo(a.x+28,a.y+25);X.lineTo(a.x+18,a.y-10);X.stroke();X.strokeStyle='#bd6938';X.lineWidth=5;X.beginPath();X.moveTo(a.x-18,a.y-10);X.lineTo(p.x,p.y);X.lineTo(a.x+18,a.y-10);X.stroke();animal({x:p.x,y:p.y-5,l:queue[0],r:22,hit:0},.96)}
function draw(now){let dt=Math.min(2,(now-last)/16.67);last=now;X.clearRect(0,0,W,H);step(dt);bodies.forEach(animal);sling();if(flash>0){X.fillStyle=`rgba(255,255,210,${flash/45})`;X.fillRect(0,0,W,H);flash--}requestAnimationFrame(draw)}function pop(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1200)}function reset(){bodies=[];queue=[];score=0;over=false;drag=null;scoreEl.textContent=0;refill();pop('Yeni oyun')}
document.querySelector('#reset').onclick=reset;document.querySelectorAll('.map').forEach(b=>b.onclick=()=>{document.querySelector('.map.active').classList.remove('active');b.classList.add('active');map=b.dataset.map;game.style.backgroundImage=`url(${maps[map].bg})`;reset()});game.style.backgroundImage=`url(${maps[map].bg})`;refill();requestAnimationFrame(draw);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
